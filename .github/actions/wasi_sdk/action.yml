name: 'Setup WASI SDK'
inputs:
  arch:
    description: 'OS / Architecture (ex: arm64-macos)'
    default: 'arm64-macos'
  version:
    description: 'SDK version'
    default: '25'

runs:
  using: "composite"
  steps:

    - name: Install WASI SDK
      if: steps.cache-wasi-sdk.outputs.cache-hit != 'true'
      shell: bash
      env:
        # gh goes through the authenticated API rather than an anonymous
        # github.com release download
        GH_TOKEN: ${{ github.token }}
        VERSION: ${{ inputs.version }}
        ARCH: ${{ inputs.arch }}
      run: |
        mkdir /tmp/wasi-sdk
        gh release download "wasi-sdk-${VERSION}" --repo WebAssembly/wasi-sdk \
          --pattern "wasi-sdk-${VERSION}.0-${ARCH}.tar.gz" --output - \
          | tar xz --strip-components 1 -C /tmp/wasi-sdk
        sudo mv /tmp/wasi-sdk /opt/wasi-sdk
