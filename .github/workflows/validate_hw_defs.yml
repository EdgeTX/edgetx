name: Validate hw_defs
on:
  push:
    branches:
      - 'main'
      - '[0-9]+.[0-9]+'
    paths:
      - 'radio/util/hw_defs/**'
      - 'radio/src/boards/hw_defs/**'
      - 'tools/hwdef_schema.json'
      - '.github/workflows/validate_hw_defs.yml'
  pull_request:
    paths:
      - 'radio/util/hw_defs/**'
      - 'radio/src/boards/hw_defs/**'
      - 'tools/hwdef_schema.json'
      - '.github/workflows/validate_hw_defs.yml'
  workflow_dispatch:

jobs:
  validate:
    name: Validate hw_defs
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: radio/util/hw_defs
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Install Python dependencies
        working-directory: .
        run: uv sync

      - name: Check Python script syntax
        run: uv run python3 -m py_compile *.py

      - name: Validate against Pydantic model
        run: uv run python3 json_validator.py ../../src/boards/hw_defs

      - name: Validate against hwdef_schema.json
        working-directory: .
        run: uvx check-jsonschema --schemafile tools/hwdef_schema.json radio/src/boards/hw_defs/*.json

      - name: Test template generation (all boards x all templates)
        run: uv run python3 test_templates.py ../../src/boards/hw_defs
