name: MacOSX Companion

on:
  workflow_call:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15-intel
    if: |
      github.event_name != 'pull_request' ||
      !contains(github.event.pull_request.labels.*.name, 'ci: skip-cpn-macos')

    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 3

    steps:
      - name: Select XCode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.0'

      - name: Check out the repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python3 -m pip install --upgrade pip Pillow lz4 clang jinja2

      - name: Setup and Build
        uses: ./.github/actions/build_companion
        with:
          os: 'macos'
          qt-arch: 'clang_64'
          # Setup Python 3.12 above already provisioned the codegen packages
          setup-python: 'false'
