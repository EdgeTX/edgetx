---
name: Run tests and package firmware
on:
  push:
    branches:
      - 'main'
      - '[0-9]+.[0-9]+'
    tags:
      - v*
    paths: &trigger-paths
      - '.github/workflows/actions.yml'
      - 'cmake/**'
      - 'radio/**'
      - 'tools/build-gh.sh'
      - '.gitmodules'
      - 'CMakeLists.txt'
  pull_request:
    branches:
      - 'main'
      - '[0-9]+.[0-9]+'
    paths: *trigger-paths

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - x9dp2019
          - tx16s
          - nv14
          - el18
          - pl18
          - pl18ev
          - t12
          - t12max
          - t15
          - t16
          - t18
          - t8
          - tlite
          - t20
          - t14
          - t20v2
          - tx12
          - x10
          - x12s
          - x7
          - x9d
          - x9dp
          - x9e
          - x9lite
          - x9lites
          - xlite
          - xlites
          - mt12
          - gx12
          - nb4p
          - st16
    container:
      image: ghcr.io/edgetx/edgetx-dev:2.11
      volumes:
        - ${{ github.workspace }}:/src
      # Needed to write the kernel parameters below. The runner is a
      # throwaway VM where the job already has sudo, so this doesn't open up
      # anything the job couldn't do anyway.
      options: --privileged
    steps:
      # https://github.com/actions/runner-images/issues/15108
      # The ubuntu-26.04 runner images (rolling out as ubuntu-latest since
      # 2026-10-19) don't apply the image's kernel parameters at boot, so
      # restore them until
      # https://github.com/actions/runner-images/pull/15146 ships. At
      # vm.mmap_rnd_bits=32 the GCC 9 ASan runtime in edgetx-dev:2.11 can
      # crash as gtests-radio starts and loop printing
      # "AddressSanitizer:DEADLYSIGNAL". These settings are kernel-wide, so
      # writing them from the privileged container applies to the whole
      # runner VM. Once the "before" values already match, remove this step
      # and the --privileged option.
      - name: Restore kernel parameters
        run: |
          sysctl vm.mmap_rnd_bits fs.inotify.max_user_instances fs.inotify.max_user_watches
          sysctl -w fs.inotify.max_user_instances=1280 fs.inotify.max_user_watches=655360 vm.mmap_rnd_bits=28

      - name: Check out the repo
        uses: actions/checkout@v7
        with:
          submodules: recursive
          # fetch-depth: 0 # https://github.com/actions/checkout#Fetch-all-history-for-all-tags-and-branches

      - name: Test ${{ matrix.target }}
        # Normally 1-5 minutes. Stops a crashed ASan run from flooding the
        # log until the runner loses contact (about an hour).
        timeout-minutes: 15
        env:
          FLAVOR: ${{ matrix.target }}
        run: |
          echo "Running commit tests"
          ./tools/commit-tests.sh


  build:
    name: Run builds
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - nv14;el18
          - pl18;pl18ev;pl18u
          - pa01
          - t12;t12max
          - t15;t16;t18
          - t8;zorro;pocket;mt12;commando8
          - tlite;tpro;tprov2;tpros;bumblebee;lr3pro
          - t20;t20v2;t14
          - tx12;tx12mk2;boxer;gx12
          - tx16s
          - f16
          - v14;v16
          - x10;x10express
          - x12s
          - x7;x7access
          - x9d;x9dp;x9dp2019
          - x9e;x9e-hall
          - x9lite;x9lites
          - xlite;xlites
          - mt12;gx12
          - nb4p
          - st16
    container:
      image: ghcr.io/edgetx/edgetx-dev:2.11
      volumes:
        - ${{ github.workspace }}:/src
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Build ${{ matrix.target }}
        env:
          FLAVOR: ${{ matrix.target }}
        run: |
          echo "Running firmware build"
          ./tools/build-gh.sh

      - name: Upload ${{ matrix.target }}
        uses: actions/upload-artifact@v7
        with:
          name: firmware-${{ matrix.target }}
          path: |
            fw.json
            LICENSE
            *.bin
            *.uf2
          retention-days: 15
          if-no-files-found: error

  package:
    name: Package firmwares
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Compose release filename
        # https://stackoverflow.com/questions/58033366/how-to-get-current-branch-within-github-actions
        run: echo "artifact_name=edgetx-firmware-${GITHUB_REF##*/}" >> $GITHUB_ENV

      - name: Merge firmware artifact packages
        uses: actions/upload-artifact/merge@v7
        with:
          name: "${{ env.artifact_name }}"
          pattern: firmware-*
          delete-merged: true
          retention-days: 15
