name: Create Release Draft

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to create release for'
        required: true
        type: string
      summary:
        description: 'Sentence appended to the opening line'
        required: false
        type: string
        default: 'a maintenance release recommended for all users on the 2.11 firmware series'
      highlights:
        description: 'Optional paragraph after the opening line, calling out the most notable fixes'
        required: false
        type: string
      custom_build_issue:
        description: 'Issue number for custom build requests'
        required: false
        type: string
        default: '6165'
      tracking_issue:
        description: 'Pre-release tracking issue number, listed under Known Limitations'
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Create draft release
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Clean up any previous drafts for this version
        run: |
          TAG="${{ inputs.tag }}"
          if gh release view "$TAG" --json isDraft --jq '.isDraft' 2>/dev/null | grep -q true; then
            echo "Deleting existing draft release for tag: $TAG"
            gh release delete "$TAG" --yes
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version info
        id: version
        continue-on-error: false
        run: |
          VERSION="${{ inputs.tag }}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          # Issue numbers may be entered with or without a leading "#"
          CUSTOM_BUILD_ISSUE="${{ inputs.custom_build_issue }}"
          TRACKING_ISSUE="${{ inputs.tracking_issue }}"
          echo "custom_build_issue=${CUSTOM_BUILD_ISSUE##*#}" >> $GITHUB_OUTPUT
          echo "tracking_issue=${TRACKING_ISSUE##*#}" >> $GITHUB_OUTPUT

          # For a patch release, link back to the .0 notes which carry the full
          # list of what is new in the series.
          BASE=$(echo "$VERSION" | sed -E 's/^v?([0-9]+)\.([0-9]+)\.([0-9]+).*/\1.\2.\3/')
          MAJOR=${BASE%%.*}; REST=${BASE#*.}; MINOR=${REST%%.*}; PATCH=${REST##*.}
          if [ "$PATCH" != "0" ]; then
            echo "series_tag=v${MAJOR}.${MINOR}.0" >> $GITHUB_OUTPUT
            echo "has_series_link=true" >> $GITHUB_OUTPUT
          else
            echo "has_series_link=false" >> $GITHUB_OUTPUT
          fi

          # Previous release, for the changelog range and to carry notes forward from
          PREV_TAG=$(git describe --tags --abbrev=0 --match 'v[0-9]*' "${VERSION}^" 2>/dev/null || echo "")
          echo "prev_tag=$PREV_TAG" >> $GITHUB_OUTPUT
          echo "Previous tag: ${PREV_TAG:-none}"

          # Extract codename from CMakeLists.txt
          if [ -f "CMakeLists.txt" ]; then
            CODENAME=$(grep -oP 'set\(CODENAME\s+"\K[^"]+' CMakeLists.txt || echo "")
            if [ -n "$CODENAME" ]; then
              if [ "$CODENAME" = "dev" ]; then
                echo "::error::CODENAME is set to 'dev' for a tagged release! Please update the CODENAME in CMakeLists.txt before creating a release."
                exit 1
              fi
              echo "codename=$CODENAME" >> $GITHUB_OUTPUT
              echo "has_codename=true" >> $GITHUB_OUTPUT
              echo "Found codename: $CODENAME"
            else
              echo "has_codename=false" >> $GITHUB_OUTPUT
              echo "No codename found"
            fi
          else
            echo "has_codename=false" >> $GITHUB_OUTPUT
            echo "CMakeLists.txt not found"
          fi

      - name: Carry forward notes from the previous release
        id: series
        if: steps.version.outputs.prev_tag != ''
        run: |
          # Known limitations and UI/UX notes are curated by hand on each 2.11.x
          # release, so start from the latest published one rather than 2.11.0.
          PREV="${{ steps.version.outputs.prev_tag }}"

          if ! gh release view "$PREV" --json body --jq '.body' > prev.md 2>/dev/null; then
            echo "No $PREV release to carry sections forward from."
            exit 0
          fi
          tr -d '\r' < prev.md > prev.clean && mv prev.clean prev.md

          # Section runs from its heading to the next "## ", with blank lines trimmed.
          extract() {
            awk -v hdr="$1" 'index($0, hdr) == 1 && !f { f = 1; next } f && /^## / { exit } f' prev.md \
              | sed -e '/./,$!d' | tac | sed -e '/./,$!d' | tac
          }

          for pair in "known_limitations:## Known Limitations and Issues" \
                      "uiux_changes:## UI/UX behavioral changes"; do
            name="${pair%%:*}"
            value=$(extract "${pair#*:}")
            {
              echo "${name}<<SERIES_EOF"
              echo "$value"
              echo "SERIES_EOF"
            } >> $GITHUB_OUTPUT
            echo "$name: $(printf '%s' "$value" | grep -c '^- ' || true) point(s) from $PREV"
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install git-cliff
        run: |
          VERSION=$(wget -qO- https://api.github.com/repos/orhun/git-cliff/releases/latest | grep '"tag_name":' | sed -E 's/.*"([^"]+)".*/\1/' | sed 's/^v//')
          FILENAME="git-cliff-${VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          wget -O git-cliff.tar.gz "https://github.com/orhun/git-cliff/releases/download/v${VERSION}/${FILENAME}"
          tar -xzvf git-cliff.tar.gz
          mv git-cliff-${VERSION}/git-cliff /usr/local/bin/

      - name: Generate Changelog and Contributors List
        id: changelog
        run: |
          PREV_TAG="${{ steps.version.outputs.prev_tag }}"

          if [ -z "$PREV_TAG" ]; then
            echo "No previous tag found. Generating full history for ${{ inputs.tag }}"
            RANGE="${{ inputs.tag }}"
            CONTRIB_RANGE="${{ inputs.tag }}"
          else
            echo "Found previous tag: $PREV_TAG"
            RANGE="$PREV_TAG..${{ inputs.tag }}"
            CONTRIB_RANGE="$RANGE"
          fi

          # Generate the changelog using the explicit range
          git-cliff $RANGE --strip all --output CHANGELOG.md

          # Get unique contributors from the same commit range, resolving each to their
          # GitHub username (via the GraphQL API) so they can be @-mentioned, falling
          # back to the commit author name when no GitHub account can be resolved.
          mapfile -t CONTRIB_LINES < <(git log --format='%H|%aN|%ae' $CONTRIB_RANGE 2>/dev/null | awk -F'|' '!seen[$2"|"$3]++')

          if [ "${#CONTRIB_LINES[@]}" -eq 0 ]; then
            CONTRIBUTORS=""
          else
            OWNER="${{ github.repository }}"
            REPO_NAME="${OWNER#*/}"
            OWNER="${OWNER%/*}"

            QUERY_BODY=""
            i=0
            for line in "${CONTRIB_LINES[@]}"; do
              sha="${line%%|*}"
              QUERY_BODY+="c$i: repository(owner: \"$OWNER\", name: \"$REPO_NAME\") { object(oid: \"$sha\") { ... on Commit { author { name user { login } } } } } "
              i=$((i+1))
            done

            CONTRIBUTORS=$(gh api graphql -f query="query { $QUERY_BODY }" \
              | jq -r '.data | to_entries[] | (.value.object.author.user.login | if . then "@" + . else null end) // .value.object.author.name' \
              | awk '!seen[$0]++' \
              | sort -f \
              | sed 's/^/- /')
          fi

          # Combine
          CHANGELOG_CONTENT=$(cat CHANGELOG.md)

          {
            echo "changelog<<EOF"
            echo "$CHANGELOG_CONTENT"
            echo "EOF"
          } >> $GITHUB_OUTPUT

          {
            echo "contributors<<EOF"
            echo "$CONTRIBUTORS"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Download all release artifacts
        run: |
          TAG="${{ inputs.tag }}"
          COMMIT_SHA=$(git rev-parse "${TAG}^{commit}")
          echo "Tag $TAG points to commit: $COMMIT_SHA"

          # Get the latest successful run ID for each unique workflow, filtering to tag-triggered runs only
          WORKFLOW_RUNS=$(gh run list --branch "$TAG" --status success --json workflowName,databaseId,createdAt --jq 'group_by(.workflowName) | map(sort_by(.createdAt) | last) | .[].databaseId')

          if [ -z "$WORKFLOW_RUNS" ]; then
            echo "ERROR: No successful workflow runs found for tag $TAG. Ensure the tag-triggered build completed successfully before running this workflow."
            exit 1
          fi

          mkdir -p release-assets

          for run_id in $WORKFLOW_RUNS; do
            echo "Processing Run ID: $run_id"
            gh run download "$run_id" --dir release-assets 2>/dev/null || true
          done

          cd release-assets

          # Clean up: Delete any folders ending in "-logs" BEFORE we start zipping
          echo "Cleaning up log artifacts..."
          rm -rf *-logs/

          # Package remaining folders into zips
          for dir in */; do
            # Ensure we are actually looking at a directory
            [ -d "$dir" ] || continue
            dir_name="${dir%/}"

            echo "Processing folder: $dir_name"

            # Check for existing zip inside (e.g. if firmware was already zipped)
            INNER_ZIP=$(find "$dir" -maxdepth 1 -name "*.zip" | head -n 1)

            if [ -n "$INNER_ZIP" ]; then
              echo "  Found existing zip, pulling it out..."
              mv "$INNER_ZIP" "${dir_name}.zip"
            else
              echo "  No zip found, creating ${dir_name}.zip..."
              (cd "$dir" && zip -r "../${dir_name}.zip" .)
            fi

            # Remove the folder after zipping/moving
            rm -rf "$dir"
          done

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: List release assets
        run: |
          echo "Release assets to upload:"
          ls -lh release-assets/*.zip

      - name: Create draft release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag }}
          draft: true
          prerelease: ${{ contains(inputs.tag, '-rc') || contains(inputs.tag, '-beta') || contains(inputs.tag, '-alpha') }}
          name: EdgeTX "${{ steps.version.outputs.codename }}" ${{ steps.version.outputs.version }}
          body: |
            We are pleased to offer EdgeTX "${{ steps.version.outputs.codename }}" ${{ steps.version.outputs.version }}${{ inputs.summary != '' && format(', {0}', inputs.summary) || '' }}.

            ${{ inputs.highlights }}

            ${{ (contains(inputs.tag, '-rc') || contains(inputs.tag, '-beta') || contains(inputs.tag, '-alpha')) && '> [!WARNING]
            > As this is a pre-release, it is virtually guaranteed there will still be some minor issues that need resolving before final release - some may be documented already under "known issues" section of these release notes or the associated tracking issue. During pre-releases, the matching SD card pack and voice pack versions to use are those marked/tagged ''Latest''.
            >
            > We **need** _your_ help in testing this release to ensure there are no major bugs or faults that will cause problems during flight.  Please ensure you back up your model and radio settings before updating, fully bench-test your models after updating, and report any issues you encounter. It is only with your feedback and testing by you, our community (and the assistance provided by partner manufacturers) which will allow us to identify and squash both new and old bugs, and progress onto a stable release version!! We simply cannot do this without you! :hugs: :beers:' || 'As with _any_ update, please ensure you back up your model and radio settings before updating, fully bench-test your models after updating, and report any issues you encounter. Thank you for all the feedback and testing by you, the community (and partner manufacturers) which has allowed us to identify and squash both new and old bugs!! We simply cannot have done this without you! :hugs: :beers:' }}

            > [!NOTE]
            > **MacOS users**
            > Companion is now only compiled for MacOS 12 and above. Stay with v2.10.5 or earlier if you need support for an older version of MacOS.

            > [!NOTE]
            > **Migration Information**
            > - If you have an old OpenTX Companion (`.otx`) file you need to convert or open, you will need to use EdgeTX Companion v2.10 or earlier.
            > - If you wish to upgrade from OpenTX 2.3 or EdgeTX 2.4/2.5, you must use either EdgeTX v2.8.x firmware or EdgeTX Companion v2.10.x.
            >
            > See the [EdgeTX Manual](https://manual.edgetx.org/installing-and-updating-edgetx) for more information.

            ## Changes

            ${{ steps.changelog.outputs.changelog }}

            ${{ steps.version.outputs.prev_tag != '' && format('**Full Changelog**: https://github.com/{0}/compare/{1}...{2}', github.repository, steps.version.outputs.prev_tag, inputs.tag) || '' }}

            ${{ steps.version.outputs.has_series_link == 'true' && format('You can also [check the {0} release notes](https://github.com/EdgeTX/edgetx/releases/tag/{1}) for what was new or changed in this release series.', steps.version.outputs.series_tag, steps.version.outputs.series_tag) || '' }}

            ## Known Limitations and Issues
            ${{ (contains(inputs.tag, '-rc') || contains(inputs.tag, '-beta') || contains(inputs.tag, '-alpha')) && steps.version.outputs.tracking_issue != '' && format('> [!WARNING]
            > Please check #{0} during the release candidate phase for any other release candidate-specific issues and status of fixes.', steps.version.outputs.tracking_issue) || '' }}
            ${{ steps.series.outputs.known_limitations }}

            ${{ steps.series.outputs.uiux_changes != '' && '## UI/UX behavioral changes and/or new capabilities:' || '' }}
            ${{ steps.series.outputs.uiux_changes }}

            ## Supported radios
            The full list of supported radios and their support status can be viewed [here on the EdgeTX website](https://edgetx.org/supportedradios).

            ## Installation Guide
            https://manual.edgetx.org/installing-and-updating-edgetx

            ## Flash firmware via Chrome based browser
            https://buddy.edgetx.org/#/flash?version=${{ steps.version.outputs.version }}

            ## Language and Custom builds
            The [CloudBuild option in EdgeTX Buddy](https://buddy.edgetx.org/) will allow you build your own (supported) language firmware, via the `language` flag option. Additionally, EdgeTX Companion also has some support for CloudBuild, and will automatically fetch firmware for a supported language when you use the "Update components" option. But you can also build your own firmware online [following this guide](https://github.com/EdgeTX/edgetx/wiki/Building-radio-firmware-in-a-web-browser-with-GitHub-CodeSpaces)${{ steps.version.outputs.custom_build_issue != '' && format(', request a specific build at #{0}', steps.version.outputs.custom_build_issue) || '' }} or ask on Discord for someone to build one for you.

            ${{ steps.changelog.outputs.contributors != '' && '## Contributors
            Thank you to the following contributors who made this release possible!' || '' }}
            ${{ steps.changelog.outputs.contributors }}
          files: release-assets/*.zip
          fail_on_unmatched_files: true
