name: Companion

on:
  push:
    branches:
      - 'main'
    tags:
      - v*
    paths:
      - '.github/workflows/companion.yml'
      - '.github/workflows/wasm_modules.yml'
      - '.github/actions/python_dependencies/**'
      - '.github/actions/wasi_sdk/**'
      - '.github/actions/build_companion/**'
      - 'companion/**'
      - 'fw.json'
      - 'pyproject.toml'
      - 'tools/build-companion.sh'
      - 'tools/build-wasm-modules.sh'
      - 'cmake/wasm/CMakeLists.txt'
      - 'cmake/FetchWamr.cmake'
      - 'cmake/wamr-*.patch'

  pull_request:
    paths:
      - '.github/workflows/companion.yml'
      - '.github/workflows/wasm_modules.yml'
      - '.github/actions/python_dependencies/**'
      - '.github/actions/wasi_sdk/**'
      - '.github/actions/build_companion/**'
      - 'companion/**'
      - 'fw.json'
      - 'pyproject.toml'
      - 'tools/build-companion.sh'
      - 'tools/build-wasm-modules.sh'
      - 'cmake/wasm/CMakeLists.txt'
      - 'cmake/FetchWamr.cmake'
      - 'cmake/wamr-*.patch'

  workflow_dispatch:
    inputs:
      target:
        description: 'Build target'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - linux
          - macos
          - windows
          - wasm

jobs:
  modules:
    name: Modules
    uses: ./.github/workflows/wasm_modules.yml

  build-linux:
    name: Linux Companion
    runs-on: ubuntu-latest
    needs: modules
    if: |
      (inputs.target == 'all' || inputs.target == 'linux' || inputs.target == '') &&
      (github.event_name != 'pull_request' || !contains(github.event.pull_request.labels.*.name, 'ci: skip-cpn-linux'))

    container:
      image: ghcr.io/edgetx/edgetx-dev:latest
      volumes:
        - ${{ github.workspace }}:/src

    steps:
      - name: Check out the repo
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Download WASM modules
        uses: actions/download-artifact@v8
        with:
          pattern: wasm-modules-*
          path: wasm-modules
          merge-multiple: true

      - name: Setup and Build
        uses: ./.github/actions/build_companion
        with:
          os: 'linux'

      - name: Run companion unit tests
        shell: bash
        run: cmake --build build/native --target tests-companion --parallel

  build-macos:
    name: macOS Companion
    runs-on: macos-15
    needs: modules
    if: |
      (inputs.target == 'all' || inputs.target == 'macos' || inputs.target == '') &&
      (github.event_name != 'pull_request' || !contains(github.event.pull_request.labels.*.name, 'ci: skip-cpn-macos'))

    env:
      CMAKE_OSX_ARCHITECTURES: 'x86_64;arm64'
      CMAKE_OSX_DEPLOYMENT_TARGET: '11.0'

    steps:
      - name: Check out the repo
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Download WASM modules
        uses: actions/download-artifact@v8
        with:
          pattern: wasm-modules-*
          path: wasm-modules
          merge-multiple: true

      - name: Setup and Build
        uses: ./.github/actions/build_companion
        with:
          os: 'macos'
          qt-arch: 'clang_64'

  build-win64:
    name: Windows Companion
    runs-on: windows-latest
    needs: modules
    if: |
      (inputs.target == 'all' || inputs.target == 'windows' || inputs.target == '') &&
      (github.event_name != 'pull_request' || !contains(github.event.pull_request.labels.*.name, 'ci: skip-cpn-win'))

    env:
      CMAKE_GENERATOR: 'Ninja'
      CXX: 'clang++'
      CC: 'clang'

    defaults:
      run:
        shell: bash

    steps:
      - name: Check out the repo
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Download WASM modules
        uses: actions/download-artifact@v8
        with:
          pattern: wasm-modules-*
          path: wasm-modules
          merge-multiple: true

      - name: Setup and Build
        uses: ./.github/actions/build_companion
        with:
          os: 'win64'
          qt-arch: 'win64_msvc2022_64'
